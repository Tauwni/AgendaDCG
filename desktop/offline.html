<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Agenda DCG</title>
<style>
:root { --bg: #fff; --text: #000; --text2: #8e8e93; --accent: #ff3b30; }
@media (prefers-color-scheme: dark) { :root { --bg: #000; --text: #fff; --accent: #ff453a; } }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
h1 { font-size: 22px; margin: 0 0 8px; }
p { color: var(--text2); margin: 0 0 22px; }
button { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 12px 28px; cursor: pointer; }
</style>
</head>
<body>
  <div>
    <h1>Pas de connexion</h1>
    <p>L'agenda a besoin d'internet pour se synchroniser avec la classe.</p>
    <button id="retry">Réessayer</button>
  </div>
<script>
const target = new URLSearchParams(location.search).get("retry") || "https://agendadcg.netlify.app";
document.getElementById("retry").onclick = () => { location.href = target.startsWith("https://agendadcg.netlify.app") ? target : "https://agendadcg.netlify.app"; };
setInterval(() => { if (navigator.onLine) document.getElementById("retry").click(); }, 5000);
</script>
</body>
</html>

function openSubject(subject) {
  const s = gradesBySubject().find((x) => sameSubject(x.subject, subject));
  if (!s) { closeSheet(); return; }
  const a = weightedAverage(s.grades);
  const bd = openSheet(`
    <div class="sheet-head">
      <button class="link" data-act="close">Fermer</button>
      <h3></h3>
      <button class="link bold" data-act="add">${ICON.plus}</button>
    </div>
    <div class="sheet-body">
      <div>
        <div class="detail-sub">${esc(s.subject)}</div>
        <div class="avg-big" style="margin-top:4px">${a === null ? "—" : fr(a, 2)}<small> /20</small></div>
      </div>
      <div class="group" style="padding:12px 8px 6px">${chartSvg(s.grades, { width: 340, height: 170 })}</div>
      <div class="legend"><span><i></i>Notes</span><span><i class="dash"></i>Moyenne</span>${s.grades.some((g) => g.category === "entrainement") ? `<span><i class="ring"></i>Entraînement (hors moyenne)</span>` : ""}</div>
      <div>
        <div class="label">Simulateur</div>
        <div class="group sim">
          <div class="sim-row"><span>Moyenne visée</span><input type="number" inputmode="decimal" step="0.5" min="0" max="20" name="target" value="${a !== null && a < 12 ? 12 : 14}"></div>
          <div class="sim-row"><span>Coefficient du prochain contrôle</span><input type="number" inputmode="decimal" step="0.5" min="0.1" max="20" name="coef" value="1"></div>
          <div class="sim-out" id="simOut"></div>
        </div>
      </div>
      <div>
        <div class="label">${plural(s.grades.length, "note")}</div>
        <div class="group">${[...s.grades].reverse().map((g) => `
          <button class="grade-row" data-grade="${g.id}">
            <span class="grade-body"><b>${esc(g.title || CATEGORY[g.category])}</b><small>${CATEGORY[g.category]} · ${shortDate(g.date)}${g.coef !== 1 ? ` · coef ${fr(g.coef)}` : ""}</small></span>
            <span class="grade-val">${fr(g.value, 2)}<small>/${fr(g.outOf)}</small></span>
          </button>`).join("")}</div>
      </div>
    </div>`);
  const simulate = () => {
    const target = Number(bd.querySelector("[name=target]").value.replace(",", "."));
    const coef = Number(bd.querySelector("[name=coef]").value.replace(",", "."));
    const c = counted(s.grades);
    const S = c.reduce((sum, g) => sum + on20(g) * g.coef, 0);
    const C = c.reduce((sum, g) => sum + g.coef, 0);
    const out = bd.querySelector("#simOut");
    if (!(target >= 0 && target <= 20) || !(coef > 0)) { out.textContent = "Entre une moyenne entre 0 et 20 et un coefficient positif."; return; }
    const need = (target * (C + coef) - S) / coef;
    out.innerHTML = need > 20
      ? `Même avec <b>20/20</b>, ta moyenne monterait à ${fr((S + 20 * coef) / (C + coef), 2)}. Il faudra plusieurs bonnes notes pour atteindre ${fr(target)}.`
      : need <= 0
        ? `C'est déjà gagné : même avec <b>0/20</b>, ta moyenne reste à ${fr((S) / (C + coef), 2)} ou plus.`
        : `Il te faut au moins <b>${fr(Math.ceil(need * 4) / 4, 2)}/20</b> au prochain contrôle pour atteindre ${fr(target)} de moyenne.`;
  };
  bd.querySelectorAll(".sim input").forEach((i) => i.addEventListener("input", simulate));
  simulate();
  bd.querySelector("[data-act=close]").onclick = closeSheet;
  bd.querySelector("[data-act=add]").onclick = () => openGradeEdit(null, s.subject);
  bd.querySelectorAll("[data-grade]").forEach((b) => b.onclick = () => openGradeEdit((state.profile.grades || []).find((g) => g.id === b.dataset.grade), s.subject));
}

function openGradeEdit(g, subject) {
  const d = g ? { ...g } : { subject: subject || "", title: "", date: iso(new Date()), value: "", outOf: 20, coef: 1, category: "controle" };
  const back = () => (subject ? openSubject(subject) : closeSheet());
  const bd = openSheet(`
    <div class="sheet-head">
      <button class="link" data-act="cancel">Annuler</button>
      <h3>${g ? "Modifier la note" : "Nouvelle note"}</h3>
      <button class="link bold" data-act="save">${g ? "OK" : "Ajouter"}</button>
    </div>
    <div class="sheet-body">
      <div class="segmented" style="grid-template-columns:repeat(4,1fr)">
        ${Object.entries(CATEGORY).map(([k, v]) => `<button type="button" data-cat="${k}" class="${d.category === k ? "on" : ""}">${v.replace("Contrôle UFA", "Contrôle")}</button>`).join("")}
      </div>
      <div class="group">
        <input name="subject" placeholder="Matière" maxlength="60" list="subjectList" autocomplete="off" value="${esc(d.subject)}">
        <input name="title" placeholder="Intitulé (facultatif)" maxlength="120" value="${esc(d.title)}">
      </div>
      ${subjectDatalist()}
      <div class="group">
        <div class="row"><span>Note</span><span><input name="value" type="number" inputmode="decimal" step="0.25" min="0" style="width:80px;text-align:right;border:0;background:var(--bg2);border-radius:7px;padding:5px 8px" value="${esc(d.value)}"> / <input name="outOf" type="number" inputmode="decimal" step="1" min="1" max="100" style="width:56px;text-align:right;border:0;background:var(--bg2);border-radius:7px;padding:5px 8px" value="${esc(d.outOf)}"></span></div>
        <div class="row"><span>Coefficient</span><input name="coef" type="number" inputmode="decimal" step="0.5" min="0.1" max="20" style="width:80px;text-align:right;border:0;background:var(--bg2);border-radius:7px;padding:5px 8px" value="${esc(d.coef)}"></div>
        <div class="row"><span>Date</span><input type="date" name="date" value="${esc(d.date)}"></div>
      </div>
      <div class="label" style="margin-top:-8px">Les entraînements apparaissent sur le graphique mais ne comptent pas dans la moyenne.</div>
      ${g ? `<button class="btn-row" data-act="delete">Supprimer la note</button>` : ""}
    </div>`);
  bd.querySelectorAll("[data-cat]").forEach((b) => b.onclick = () => {
    d.category = b.dataset.cat;
    bd.querySelectorAll("[data-cat]").forEach((x) => x.classList.toggle("on", x === b));
  });
  const v = (n) => bd.querySelector(`[name=${n}]`).value.replace(",", ".");
  bd.querySelector("[data-act=cancel]").onclick = back;
  bd.querySelector("[data-act=save]").onclick = async (ev) => {
    const grade = { id: g?.id, subject: canonicalSubject(v("subject")), title: bd.querySelector("[name=title]").value, date: v("date"), category: d.category, value: Number(v("value")), outOf: Number(v("outOf")), coef: Number(v("coef")) };
    if (!grade.subject) return toast("Choisis la matière");
    if (v("value") === "" || !(grade.value >= 0 && grade.value <= grade.outOf)) return toast(`Entre une note entre 0 et ${fr(grade.outOf || 20)}`);
    ev.target.innerHTML = `<span class="spinner"></span>`;
    try {
      const list = (state.profile.grades || []).filter((x) => x.id !== g?.id);
      await saveGrades([...list, grade]);
      toast(g ? "Note modifiée" : "Note ajoutée");
      openSubject(grade.subject);
    } catch (err) { toast(err.message); ev.target.textContent = g ? "OK" : "Ajouter"; }
  };
  bd.querySelector("[data-act=delete]")?.addEventListener("click", async () => {
    if (!confirm("Supprimer cette note ?")) return;
    try {
      await saveGrades((state.profile.grades || []).filter((x) => x.id !== g.id));
      toast("Note supprimée");
      gradesBySubject().some((x) => sameSubject(x.subject, g.subject)) ? openSubject(g.subject) : closeSheet();
    } catch (err) { toast(err.message); }
  });
  if (!g) bd.querySelector(d.subject ? "[name=value]" : "[name=subject]").focus();
}

function pushSupport() {
  const ua = navigator.userAgent;
  if (/Electron/.test(ua)) return { ok: false, why: "electron" };
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (ios && !standalone) return { ok: false, why: "ios-home" };
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return { ok: false, why: "unsupported" };
  if (Notification.permission === "denied") return { ok: false, why: "denied" };
  return { ok: true };
}

function registerServiceWorker() {
  if (!("serviceWorker" in navigator) || /Electron/.test(navigator.userAgent)) return;
  navigator.serviceWorker.register("/sw.js").catch(() => {});
  if (!registerServiceWorker.bound) {
    registerServiceWorker.bound = true;
    navigator.serviceWorker.addEventListener("message", (e) => { if (e.data?.type === "open") handleDeepLink(e.data.url); });
  }
}

function urlB64ToBytes(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

async function currentSubscription() {
  if (!pushSupport().ok) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}

async function enablePush() {
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("Notifications refusées : autorise-les dans les réglages du navigateur");
  await navigator.serviceWorker.register("/sw.js");
  const reg = await navigator.serviceWorker.ready;
  const { key } = await api("push-key");
  if (!key) throw new Error("Les notifications ne sont pas encore configurées sur le serveur");
  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToBytes(key) });
  state.profile = await send("profile/push", "POST", { subscription: sub.toJSON() });
  const p = state.profile.prefs;
  if (!p.onNew && !p.daily && !p.weekly && !p.before.length) {
    state.profile = await send("profile/prefs", "PUT", { prefs: { onNew: true, daily: false, weekly: true, before: [1] } });
  }
}

async function disablePush() {
  const sub = await currentSubscription();
  if (sub) {
    state.profile = await send("profile/push", "DELETE", { endpoint: sub.endpoint });
    await sub.unsubscribe().catch(() => {});
  }
}

const REMINDER_LABEL = { 1: "1 jour avant", 2: "2 jours avant", 7: "1 semaine avant" };
const switchHtml = (name, on, label, sub) => `<label class="set-row"><span>${label}${sub ? `<small>${sub}</small>` : ""}</span><span class="switch"><input type="checkbox" data-pref="${name}" ${on ? "checked" : ""}><i></i></span></label>`;

function renderSettings() {
  const p = state.profile;
  const prefs = p.prefs;
  const support = pushSupport();
  const page = $("#page-settings");
  page.innerHTML = `
    <div class="page-head"><div><h1 class="page-title">Réglages</h1></div></div>

    <div class="group profile-card">
      <span class="avatar">${esc(p.name.slice(0, 1).toUpperCase())}</span>
      <span style="flex:1"><b>${esc(p.name)}</b><br><small style="color:var(--text2)">Compte privé, protégé par ton code perso</small></span>
    </div>

    <div class="section">
      <h2>Notifications</h2>
      <div class="group" id="pushDevice"><div class="notice"><span class="spinner"></span></div></div>
    </div>

    <div class="section">
      <h2>Quand me prévenir</h2>
      <div class="group">
        ${switchHtml("onNew", prefs.onNew, "À chaque nouvelle évaluation", "Quand quelqu'un ajoute une évaluation, un examen blanc, un devoir ou un exercice")}
        ${switchHtml("daily", prefs.daily, "Chaque matin", "À 7 h, ton programme du jour s'il y a quelque chose")}
        ${switchHtml("weekly", prefs.weekly, "Chaque dimanche", "À 18 h, le résumé de ta semaine")}
        <div class="set-row"><span>Rappels avant les évaluations<small>À 19 h, pour celles que tu n'as pas encore cochées</small></span></div>
        <div class="chip-toggles" style="border-top:0">${Object.entries(REMINDER_LABEL).map(([d, l]) => `<button type="button" data-before="${d}" class="${prefs.before.includes(Number(d)) ? "on" : ""}">${l}</button>`).join("")}</div>
      </div>
      <div class="label" style="margin-top:8px">Ces réglages valent pour tous les appareils où tu as activé les notifications.</div>
    </div>

    <div class="section">
      <h2>Stockage des cours</h2>
      <div class="group usage" id="usageBox"><div class="usage-text">Chargement…</div></div>
    </div>

    <div class="section">
      <button class="btn-row" data-act="logout">Se déconnecter</button>
    </div>`;

  const savePrefs = async (next) => {
    try { state.profile = await send("profile/prefs", "PUT", { prefs: next }); }
    catch (err) { toast(err.message); renderSettings(); }
  };
  page.querySelectorAll("[data-pref]").forEach((input) => input.onchange = () => savePrefs({ ...state.profile.prefs, [input.dataset.pref]: input.checked }));
  page.querySelectorAll("[data-before]").forEach((b) => b.onclick = () => {
    const d = Number(b.dataset.before);
    const set = new Set(state.profile.prefs.before);
    if (set.has(d)) set.delete(d); else set.add(d);
    b.classList.toggle("on", set.has(d));
    savePrefs({ ...state.profile.prefs, before: [...set] });
  });
  page.querySelector("[data-act=logout]").onclick = async () => {
    if (!confirm("Te déconnecter de ton compte sur cet appareil ?")) return;
    await disablePush().catch(() => {});
    await api("profile/logout", { method: "POST" }).catch(() => {});
    state.profile = null;
    showLogin();
  };

  const device = page.querySelector("#pushDevice");
  const notices = {
    electron: `Les notifications ne sont pas disponibles dans l'app Mac ou Windows. Active-les sur ton iPhone, ou en ouvrant l'agenda dans Safari ou Chrome.`,
    "ios-home": `Sur iPhone, Apple n'envoie les notifications qu'aux sites ajoutés à l'écran d'accueil :<br>1. Touche <b>Partager</b> puis <b>Sur l'écran d'accueil</b>.<br>2. Ouvre l'agenda depuis la nouvelle icône.<br>3. Reviens ici pour activer les notifications.`,
    unsupported: `Ce navigateur ne gère pas les notifications. Essaie avec Safari, Chrome ou Edge à jour.`,
    denied: `Les notifications sont bloquées pour ce site. Autorise-les dans les réglages du navigateur, puis recharge la page.`,
  };
  if (!support.ok) {
    device.innerHTML = `<div class="notice">${notices[support.why]}</div>`;
  } else {
    currentSubscription().then((sub) => {
      if (!page.isConnected) return;
      device.innerHTML = sub
        ? `<div class="set-row"><span>Activées sur cet appareil<small>${plural(state.profile.pushDevices, "appareil")} au total sur ton compte</small></span></div>
           <div class="chip-toggles"><button type="button" data-act="test">Envoyer un test</button><button type="button" data-act="off">Désactiver ici</button></div>`
        : `<button class="btn-row blue" data-act="on">Activer les notifications sur cet appareil</button>`;
      device.querySelector("[data-act=on]")?.addEventListener("click", async (e) => {
        e.target.innerHTML = `<span class="spinner"></span>`;
        try { await enablePush(); toast("Notifications activées"); } catch (err) { toast(err.message); }
        renderSettings();
      });
      device.querySelector("[data-act=test]")?.addEventListener("click", async () => {
        try { const r = await api("profile/push-test", { method: "POST" }); toast(r.sent ? "Notification envoyée" : "Aucun appareil n'a pu être prévenu"); }
        catch (err) { toast(err.message); }
      });
      device.querySelector("[data-act=off]")?.addEventListener("click", async () => {
        try { await disablePush(); toast("Notifications désactivées sur cet appareil"); } catch (err) { toast(err.message); }
        renderSettings();
      });
    });
  }

  api("usage").then((u) => {
    const box = page.querySelector("#usageBox");
    if (!box) return;
    const gb = (n) => (n / 1e9).toLocaleString("fr-FR", { maximumFractionDigits: 2 });
    const pct = Math.min(100, (u.bytes / u.limits.bytes) * 100);
    box.innerHTML = `
      <div class="usage-text"><b>${gb(u.bytes)} Go</b> utilisés sur ${gb(u.limits.bytes)} Go</div>
      <div class="usage-bar"><span style="width:${pct.toFixed(1)}%;${pct > 85 ? "background:var(--accent)" : ""}"></span></div>
      <div class="usage-sub">Ce mois-ci : ${u.classA.toLocaleString("fr-FR")} envois et ${u.classB.toLocaleString("fr-FR")} lectures. Les envois sont bloqués avant de dépasser le forfait gratuit.</div>`;
  }).catch(() => { const box = page.querySelector("#usageBox"); if (box) box.innerHTML = `<div class="usage-text">Indisponible</div>`; });
}

api("me").then(() => start()).catch(() => showLogin());
</script>

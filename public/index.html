<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda DCG">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Agenda DCG</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<style>
:root {
  --bg: #ffffff;
  --bg2: #f2f2f7;
  --card: #ffffff;
  --text: #000000;
  --text2: #8e8e93;
  --line: #e5e5ea;
  --accent: #ff3b30;
  --sheet-shadow: 0 10px 40px rgba(0,0,0,.18);
  --red: #ff3b30; --orange: #ff9500; --yellow: #ffcc00; --green: #34c759;
  --blue: #007aff; --purple: #af52de; --brown: #a2845e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --bg2: #1c1c1e; --card: #1c1c1e; --text: #ffffff;
    --text2: #8e8e93; --line: #2c2c2e; --accent: #ff453a;
    --sheet-shadow: 0 10px 40px rgba(0,0,0,.6);
    --red: #ff453a; --orange: #ff9f0a; --yellow: #ffd60a; --green: #30d158;
    --blue: #0a84ff; --purple: #bf5af2; --brown: #ac8e68;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
html { touch-action: manipulation; }
button, .grid, .weekdays, .topbar, .month-title { -webkit-user-select: none; user-select: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; line-height: 1.35; -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: var(--text); }
.hidden { display: none !important; }

/* Login */
#login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg2); }
.login-card { width: 100%; max-width: 360px; text-align: center; }
.app-icon { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 18px; background: var(--card); box-shadow: 0 4px 16px rgba(0,0,0,.12); overflow: hidden; display: flex; flex-direction: column; }
.app-icon .top { background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; padding: 4px 0 3px; text-transform: uppercase; }
.app-icon .num { flex: 1; display: grid; place-items: center; font-size: 36px; font-weight: 300; }
.login-card h1 { font-size: 28px; margin: 0 0 6px; font-weight: 700; }
.login-card p { color: var(--text2); margin: 0 0 24px; }
.group { background: var(--card); border-radius: 12px; overflow: hidden; text-align: left; }
.group input, .group textarea { width: 100%; border: 0; background: transparent; padding: 13px 16px; outline: none; }
.group > * + * { border-top: .5px solid var(--line); }
.btn-primary { width: 100%; margin-top: 16px; background: var(--accent); color: #fff; border-radius: 12px; padding: 14px; font-weight: 600; }
.btn-primary:disabled { opacity: .5; }
.error { color: var(--accent); font-size: 14px; margin-top: 12px; min-height: 18px; }

/* App shell */
#app { max-width: 1200px; margin: 0 auto; padding: 0 16px 40px; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 4px; gap: 8px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.topbar .left, .topbar .right { display: flex; align-items: center; gap: 4px; }
.link { color: var(--accent); font-size: 17px; padding: 6px 8px; border-radius: 8px; }
.link:hover { background: var(--bg2); }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--accent); }
.icon-btn:hover { background: var(--bg2); }
.icon-btn svg { width: 22px; height: 22px; }
.who { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 20px; background: var(--bg2); font-size: 14px; }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.month-title { font-size: 34px; font-weight: 700; margin: 6px 0 10px; letter-spacing: -.02em; }
.month-title span { color: var(--accent); }

.layout { display: grid; grid-template-columns: 1fr 340px; gap: 28px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; gap: 12px; } }

.weekdays, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.weekdays div { font-size: 12px; color: var(--text2); text-align: center; padding: 4px 0 6px; font-weight: 500; text-transform: uppercase; }
.weekdays div:nth-child(n+6), .day.weekend .num { color: var(--text2); }
.grid { border-top: .5px solid var(--line); }
.day { min-height: 104px; border-bottom: .5px solid var(--line); padding: 4px 3px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.day + .day { border-left: .5px solid var(--line); }
.day:nth-child(7n+1) { border-left: 0; }
.day .num { align-self: flex-end; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font-size: 15px; margin-bottom: 2px; }
.day.blank { cursor: default; }
.day.today .num { color: var(--accent); font-weight: 700; }
.day.selected .num { background: var(--text); color: var(--bg); font-weight: 700; }
.day.today.selected .num { background: var(--accent); color: #fff; }
.pill { font-size: 12px; line-height: 1.3; padding: 2px 6px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); font-weight: 500; }
.more { font-size: 11px; color: var(--text2); padding-left: 6px; }
.dots { display: none; justify-content: center; gap: 3px; height: 6px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.month-view { overflow: hidden; }
.grid { touch-action: pan-y; will-change: transform; }
.day .num { transition: background-color .25s, color .25s; }
.day.pop .num { animation: pop .42s cubic-bezier(.32,.72,0,1); }
@keyframes pop { from { transform: scale(.55); opacity: .4; } }

@media (max-width: 700px) {
  .month-title { font-size: 28px; }
  .grid { border-top: 0; }
  .day { min-height: 52px; border: 0 !important; align-items: center; padding: 2px 0; }
  .day .num { align-self: center; font-size: 17px; width: 34px; height: 34px; margin: 0; }
  .pill, .more { display: none; }
  .dots { display: flex; }
  .weekdays div { font-size: 11px; }
}

/* Day panel */
.panel h2 { font-size: 20px; margin: 4px 0 10px; font-weight: 700; }
.panel h2 small { display: block; font-size: 13px; color: var(--text2); font-weight: 500; text-transform: uppercase; letter-spacing: .02em; }
.list { display: flex; flex-direction: column; gap: 8px; }
.ev { display: flex; gap: 12px; background: var(--bg2); border-radius: 12px; padding: 12px 14px; text-align: left; width: 100%; }
.ev:hover { filter: brightness(.98); }
.ev .bar { width: 4px; border-radius: 2px; background: var(--c); flex-shrink: 0; }
.ev .body { min-width: 0; flex: 1; }
.ev .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .s { font-size: 14px; color: var(--text2); }
.ev .meta { display: flex; gap: 10px; align-items: center; margin-top: 4px; font-size: 13px; color: var(--text2); }
.ev .meta svg { width: 13px; height: 13px; vertical-align: -2px; }
.empty { color: var(--text2); padding: 22px 0; text-align: center; font-size: 15px; }
.list.enter > * { animation: rise .42s cubic-bezier(.32,.72,0,1) backwards; animation-delay: calc(var(--i, 0) * 40ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.panel h2.enter { animation: rise .35s cubic-bezier(.32,.72,0,1) backwards; }
.ev, .btn-primary, .btn-row, .icon-btn, .who, .swatch, .file { transition: transform .25s cubic-bezier(.32,.72,0,1), filter .2s, background-color .2s; }
.ev:active, .btn-primary:active, .btn-row:active, .icon-btn:active, .who:active, .swatch:active { transform: scale(.96); }
#app.enter { animation: appIn .5s cubic-bezier(.32,.72,0,1); }
@keyframes appIn { from { opacity: 0; transform: scale(.98); } }
.upcoming { margin-top: 24px; }

/* Sheet */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; align-items: center; justify-content: center; }
.sheet { background: var(--bg2); width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; border-radius: 14px; box-shadow: var(--sheet-shadow); overscroll-behavior: contain; }
.sheet .grabber { display: none; }
@media (max-width: 700px) {
  .backdrop { align-items: flex-end; }
  .sheet { border-radius: 14px 14px 0 0; max-height: 94vh; padding-bottom: env(safe-area-inset-bottom); }
  .sheet .grabber { display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--text2); opacity: .45; margin: 7px auto -4px; }
  .sheet-head { touch-action: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; position: sticky; top: 0; background: var(--bg2); z-index: 1; }
.sheet-head h3 { font-size: 17px; margin: 0; font-weight: 600; }
.sheet-head .link { padding: 0; }
.sheet-head .link.bold { font-weight: 600; }
.sheet-body { padding: 0 16px 20px; display: flex; flex-direction: column; gap: 20px; }
.label { font-size: 13px; color: var(--text2); text-transform: uppercase; margin: 0 0 6px 16px; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 11px 16px; gap: 12px; }
.row input[type=date], .row input[type=time] { border: 0; background: var(--bg2); border-radius: 7px; padding: 5px 8px; text-align: right; }
.swatches { display: flex; gap: 10px; padding: 12px 16px; flex-wrap: wrap; }
.swatch { width: 28px; height: 28px; border-radius: 50%; background: var(--c); outline-offset: 3px; }
.swatch.on { outline: 2.5px solid var(--c); }
.btn-row { width: 100%; padding: 13px 16px; text-align: center; color: var(--accent); background: var(--card); border-radius: 12px; font-size: 17px; }
.btn-row.blue { color: var(--blue); }

.detail-title { font-size: 24px; font-weight: 700; margin: 0; display: flex; gap: 10px; align-items: flex-start; }
.detail-title .bar { width: 5px; align-self: stretch; border-radius: 3px; background: var(--c); }
.detail-sub { color: var(--text2); margin-top: 4px; }
.notes { white-space: pre-wrap; padding: 12px 16px; }
.file { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.file .ico { width: 34px; height: 40px; border-radius: 5px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
.file a { color: var(--text); text-decoration: none; flex: 1; min-width: 0; }
.file a .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file a .m { font-size: 13px; color: var(--text2); }
.file .del { color: var(--text2); width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; }
.file .del:hover { color: var(--accent); background: var(--bg2); }
.upload { display: flex; align-items: center; gap: 10px; padding: 13px 16px; color: var(--blue); cursor: pointer; }
.upload input { display: none; }
.history { font-size: 13px; color: var(--text2); padding: 10px 16px; display: flex; flex-direction: column; gap: 4px; }
.history b { color: var(--text); font-weight: 600; }
.lib-btn { display: flex; align-items: center; gap: 5px; font-weight: 500; }
.lib-btn svg { width: 21px; height: 21px; }
@media (max-width: 480px) { .lib-btn span { display: none; } }
.segmented { display: grid; grid-template-columns: 1fr 1fr; background: var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.segmented button { padding: 7px 0; border-radius: 7px; font-size: 14px; font-weight: 500; transition: background-color .25s, box-shadow .25s; }
.segmented button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.hint { padding: 12px 16px; font-size: 14px; color: var(--text2); }
.pick { display: flex; align-items: center; gap: 12px; padding: 11px 16px; cursor: pointer; }
.pick input { position: absolute; opacity: 0; pointer-events: none; }
.pick .tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--text2); display: grid; place-items: center; flex-shrink: 0; color: #fff; transition: background-color .2s, border-color .2s, transform .25s cubic-bezier(.32,.72,0,1); }
.pick .tick svg { width: 13px; height: 13px; opacity: 0; transition: opacity .15s; }
.pick input:checked + .tick { background: var(--accent); border-color: var(--accent); transform: scale(1.06); }
.pick input:checked + .tick svg { opacity: 1; }
.pick-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pick-title { font-weight: 500; }
.pick-sub { font-size: 13px; color: var(--text2); }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 10px; background: var(--bg2); color: var(--text2); display: inline-flex; align-items: center; gap: 3px; }
.chip.on { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
.chip svg { width: 10px; height: 10px; }
.search { width: 100%; border: 0; border-radius: 10px; background: var(--line); padding: 10px 14px; outline: none; -webkit-appearance: none; }
.nav-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 16px; text-align: left; }
.nav-row:active { background: var(--bg2); }
.nav-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.nav-body b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-body small { font-size: 13px; color: var(--text2); }
.folder { color: var(--blue); width: 30px; height: 30px; flex-shrink: 0; }
.folder svg { width: 30px; height: 30px; }
.chev { width: 16px; height: 16px; color: var(--text2); opacity: .6; flex-shrink: 0; }
.folder-title { font-size: 24px; font-weight: 700; margin: 2px 0 0; }
.link.back { display: flex; align-items: center; gap: 2px; max-width: 45%; }
.link.back svg { width: 20px; height: 20px; flex-shrink: 0; margin-left: -6px; }
.back-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kind-badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 10px; margin-bottom: 8px; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }
.chapter-card + .chapter-card { margin-top: 10px; }
.chapter-head { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 12px 16px; text-align: left; gap: 10px; }
.chapter-head span { display: flex; flex-direction: column; gap: 2px; }
.chapter-head small { font-size: 13px; color: var(--text2); }
.ico.ghost { background: transparent; border: 1.5px dashed var(--text2); color: var(--text2); opacity: .7; }
.file.missing .n-wrap { flex: 1; }
.file.missing .n { font-weight: 500; }
.file.missing .m { font-size: 13px; color: var(--text2); }
.slot-empty { padding: 10px 16px; }
.slot-text { display: flex; flex-direction: column; gap: 2px; }
.slot-text b { color: var(--text); font-weight: 500; }
.slot-text span { font-size: 13px; }
.mini { font-size: 13px; color: var(--blue); cursor: pointer; padding: 4px 6px; flex-shrink: 0; }
.mini input { display: none; }
.usage { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.usage-text { font-size: 15px; }
.usage-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.usage-bar span { display: block; height: 100%; border-radius: 3px; background: var(--green); transition: width .6s cubic-bezier(.32,.72,0,1); }
.usage-sub { font-size: 13px; color: var(--text2); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 20px; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); }
.spinner { width: 18px; height: 18px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: -3px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Tabs and pages */
#app { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
.page { animation: pageIn .35s cubic-bezier(.32,.72,0,1); }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 14px 0 12px; }
.page-title { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
.page-sub { color: var(--text2); font-size: 15px; margin-top: 2px; }
.page-sub b { color: var(--text); font-weight: 600; }
.section { margin-top: 22px; }
.section h2 { font-size: 13px; color: var(--text2); text-transform: uppercase; font-weight: 500; letter-spacing: .02em; margin: 0 0 8px 4px; display: flex; justify-content: space-between; align-items: baseline; }
.section h2 button { color: var(--accent); text-transform: none; font-size: 15px; letter-spacing: 0; }
.invite { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; background: var(--bg2); color: var(--text2); font-size: 15px; }
.invite b { color: var(--accent); font-weight: 500; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--line); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; color: var(--text2); font-size: 10.5px; font-weight: 500; transition: color .2s, transform .25s cubic-bezier(.32,.72,0,1); }
.tabbar button svg { width: 26px; height: 26px; }
.tabbar button.on { color: var(--accent); }
.tabbar button:active { transform: scale(.92); }
.tab-badge { position: absolute; margin-left: 18px; margin-top: -2px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
@media (min-width: 701px) {
  #app { padding-bottom: 40px; padding-top: 58px; }
  .tabbar { top: 0; bottom: auto; padding: 8px max(16px, calc((100% - 1200px) / 2 + 16px)); grid-template-columns: repeat(5, auto); justify-content: start; gap: 4px; border-top: 0; border-bottom: .5px solid var(--line); }
  .tabbar button { flex-direction: row; gap: 7px; font-size: 15px; padding: 7px 13px; border-radius: 9px; }
  .tabbar button svg { width: 20px; height: 20px; }
  .tabbar button.on { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .tabbar button:hover:not(.on) { background: var(--bg2); }
  .tab-badge { position: static; margin: 0; }
  .topbar { top: 58px; }
}

/* Done check */
.ev { align-items: stretch; }
.check { width: 24px; height: 24px; border-radius: 50%; border: 1.6px solid color-mix(in srgb, var(--c) 70%, var(--text2)); display: grid; place-items: center; flex-shrink: 0; align-self: center; color: #fff; transition: background-color .2s, border-color .2s, transform .3s cubic-bezier(.32,.72,0,1); }
.check svg { width: 14px; height: 14px; opacity: 0; transform: scale(.4); transition: opacity .15s, transform .3s cubic-bezier(.32,.72,0,1); }
.ev.done .check { background: var(--c); border-color: var(--c); }
.ev.done .check svg { opacity: 1; transform: none; }
.check:active { transform: scale(.85); }
.ev .t, .ev .s { transition: opacity .25s, color .25s; }
.ev.done .t { text-decoration: line-through; text-decoration-color: var(--text2); color: var(--text2); }
.ev.done .bar { opacity: .4; }
.ev .kind-ico { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; color: var(--c); }
.ev.late .meta .late-tag { color: var(--accent); font-weight: 600; }
.jtag { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 8px; background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); }

/* Kinds picker */
.kinds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.kinds button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 2px; border-radius: 11px; background: var(--card); font-size: 12px; font-weight: 500; color: var(--text2); transition: background-color .2s, color .2s, transform .25s cubic-bezier(.32,.72,0,1); }
.kinds button svg { width: 22px; height: 22px; }
.kinds button.on { background: var(--accent); color: #fff; }
.kinds button:active { transform: scale(.94); }

/* Agenda header */
.agenda-tools { display: flex; align-items: center; gap: 8px; }
.view-toggle { display: grid; grid-template-columns: 1fr 1fr; background: var(--line); border-radius: 9px; padding: 2px; }
.view-toggle button { padding: 5px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; transition: background-color .25s, box-shadow .25s; }
.view-toggle button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.month-title { cursor: pointer; display: inline-flex; align-items: baseline; gap: 8px; }
.month-title .caret { width: 14px; height: 14px; color: var(--accent); transition: transform .3s cubic-bezier(.32,.72,0,1); }
.month-title small { font-size: 15px; font-weight: 500; color: var(--text2); letter-spacing: 0; }
#viewportWrap { overflow: hidden; touch-action: pan-y; }
#viewport { will-change: transform; transform-origin: 50% 0; }
.layout.week-mode { grid-template-columns: 1fr; }
.layout.week-mode .panel, .layout.week-mode .weekdays { display: none; }

/* Holidays */
.day.holiday .num { color: var(--text2); }
.pill.holiday-pill { --c: var(--text2); font-weight: 400; }
.dot.holiday-dot { background: var(--text2); opacity: .6; }
.holiday-row { font-size: 13px; color: var(--text2); padding: 2px 2px 6px; display: flex; align-items: center; gap: 6px; }
.holiday-row::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text2); opacity: .7; }

/* Week view */
.week { display: flex; flex-direction: column; }
.wday { display: grid; grid-template-columns: 54px 1fr; gap: 10px; padding: 10px 0; border-top: .5px solid var(--line); min-height: 64px; }
.wday:first-child { border-top: 0; }
.wday-head { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 2px; }
.wday-head .wd-name { font-size: 12px; color: var(--text2); text-transform: uppercase; font-weight: 500; }
.wday-head .wd-num { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; font-size: 19px; font-weight: 500; transition: background-color .25s, color .25s; }
.wday.today .wd-num { color: var(--accent); font-weight: 700; }
.wday.selected .wd-num { background: var(--text); color: var(--bg); font-weight: 700; }
.wday.today.selected .wd-num { background: var(--accent); color: #fff; }
.wday.weekend .wd-num, .wday.holiday .wd-num { color: var(--text2); }
.wday.today.weekend .wd-num { color: var(--accent); }
.wday-list { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.wday-free { color: var(--text2); opacity: .5; font-size: 14px; padding-top: 10px; }
.wday .ev { padding: 9px 12px; }
@media (min-width: 901px) {
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: .5px solid var(--line); }
  .wday { grid-template-columns: 1fr; border-top: 0; border-left: .5px solid var(--line); padding: 8px 6px; min-height: 420px; align-content: start; }
  .wday:first-child { border-left: 0; }
  .wday-head { flex-direction: row; justify-content: center; gap: 6px; }
  .wday .ev { flex-direction: column; gap: 6px; }
  .wday .ev .bar { width: auto; height: 3px; }
  .wday .check { align-self: flex-start; }
}

/* Month picker */
.mp-year { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
.mp-year b { font-size: 22px; }
.mp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mp-grid button { padding: 16px 0; border-radius: 12px; background: var(--card); font-size: 16px; font-weight: 500; text-transform: capitalize; transition: transform .25s cubic-bezier(.32,.72,0,1), background-color .2s; }
.mp-grid button.cur { color: var(--accent); font-weight: 700; }
.mp-grid button.on { background: var(--accent); color: #fff; }
.mp-grid button:active { transform: scale(.94); }
.mp-grid button small { display: block; font-size: 11px; font-weight: 500; opacity: .7; margin-top: 2px; text-transform: none; }

/* Today */
.today-date { font-size: 15px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
.stats-line { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { flex: 1; min-width: 140px; background: var(--bg2); border-radius: 12px; padding: 12px 14px; text-align: left; }
.stat b { display: block; font-size: 22px; font-weight: 700; }
.stat span { font-size: 13px; color: var(--text2); }

/* Notes */
.avg-card { background: var(--bg2); border-radius: 14px; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.avg-big { font-size: 40px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.avg-big small { font-size: 17px; color: var(--text2); font-weight: 500; }
.avg-note { font-size: 13px; color: var(--text2); margin-top: 6px; }
.subj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.subj-card { background: var(--bg2); border-radius: 14px; padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 6px; width: 100%; transition: transform .25s cubic-bezier(.32,.72,0,1); }
.subj-card:active { transform: scale(.97); }
.subj-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.subj-name { font-weight: 600; font-size: 15px; }
.subj-avg { font-size: 24px; font-weight: 700; }
.subj-avg small { font-size: 13px; color: var(--text2); font-weight: 500; }
.subj-meta { font-size: 13px; color: var(--text2); }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .ten { stroke: var(--text2); stroke-dasharray: 3 4; opacity: .5; }
.chart .avg-line { fill: none; stroke: var(--text2); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart .val-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: url(#chartFill); }
.chart .pt { fill: var(--accent); stroke: var(--bg2); stroke-width: 2; }
.chart .pt.train { fill: var(--bg2); stroke: var(--accent); }
.chart text { fill: var(--text2); font-size: 10px; }
.grade-row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; width: 100%; text-align: left; }
.grade-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.grade-body b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grade-body small { font-size: 13px; color: var(--text2); }
.grade-val { font-weight: 700; font-size: 17px; text-align: right; }
.grade-val small { display: block; font-size: 12px; color: var(--text2); font-weight: 500; }
.sim { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.sim-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sim-row input { width: 80px; text-align: right; border: 0; background: var(--bg2); border-radius: 8px; padding: 7px 10px; outline: none; }
.sim-out { font-size: 15px; padding: 10px 12px; border-radius: 10px; background: var(--bg2); }
.sim-out b { font-size: 20px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text2); padding: 0 4px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2.5px solid var(--accent); vertical-align: middle; margin-right: 5px; }
.legend i.dash { border-top: 1.5px dashed var(--text2); }
.legend i.ring { width: 8px; height: 8px; border: 2px solid var(--accent); border-radius: 50%; }

/* Settings */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
.set-row > span:first-child { flex: 1; }
.set-row small { display: block; font-size: 13px; color: var(--text2); margin-top: 2px; }
.switch { position: relative; width: 51px; height: 31px; flex: 0 0 51px; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch i { position: absolute; inset: 0; border-radius: 16px; background: var(--line); transition: background-color .25s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .3s cubic-bezier(.32,.72,0,1); }
.switch input:checked + i { background: var(--green); }
.switch input:checked + i::after { transform: translateX(20px); }
.switch input:disabled + i { opacity: .5; }
.chip-toggles { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 12px; }
.chip-toggles button { padding: 6px 12px; border-radius: 16px; background: var(--line); font-size: 14px; font-weight: 500; transition: background-color .2s, color .2s; }
.chip-toggles button.on { background: var(--accent); color: #fff; }
.notice { padding: 12px 16px; font-size: 14px; color: var(--text2); line-height: 1.45; }
.notice b { color: var(--text); }
.profile-card > * + * { border-top: 0 !important; }
.profile-card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.profile-card .avatar { width: 46px; height: 46px; font-size: 20px; }
.profile-card b { font-size: 18px; }
.login-step { margin-top: 14px; }
.login-step p { margin: 0 0 8px; font-size: 14px; }
.pin { letter-spacing: .5em; text-align: center; font-size: 22px !important; }
.link.small { font-size: 15px; margin-top: 10px; }
</style>
<script src="/pdf-tools.js" defer></script>
</head>
<body>

  <form class="login-card" id="loginForm" novalidate>

    <header class="topbar">

        <button class="icon-btn" id="prev" aria-label="Précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="link" id="todayBtn">Aujourd'hui</button>
        <button class="icon-btn" id="next" aria-label="Suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>

        </div>

        <div class="weekdays"><div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div></div>

<script>
const COLORS = ["red", "orange", "yellow", "green", "blue", "purple", "brown"];
const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MONTHS_SHORT = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const DAYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const $ = (s) => document.querySelector(s);
const EASE = "cubic-bezier(.32,.72,0,1)";
const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const isPhone = () => matchMedia("(max-width: 700px)").matches;

const KINDS = {
  eval: { label: "Évaluation", icon: `<path d="M9 4h6v3H9z"/><path d="M15 5.5h2A1.5 1.5 0 0118.5 7v12A1.5 1.5 0 0117 20.5H7A1.5 1.5 0 015.5 19V7A1.5 1.5 0 017 5.5h2"/><path d="M9 13l2 2 4-4"/>` },
  examen: { label: "Examen blanc", icon: `<circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 2M10 2.5h4"/>` },
  devoir: { label: "Devoir", icon: `<path d="M15.5 4.5l4 4L9 19l-5 1 1-5z"/><path d="M13 7l4 4"/>` },
  exercice: { label: "Exercice", icon: `<path d="M5 4.5h11.5A2.5 2.5 0 0119 7v13H7.5A2.5 2.5 0 015 17.5z"/><path d="M5 17.5A2.5 2.5 0 017.5 15H19M9 8.5h6M9 11.5h4"/>` },
  cours: { label: "Cours", icon: `<path d="M2.5 9L12 4.5 21.5 9 12 13.5z"/><path d="M6.5 11v4.5c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3V11M21.5 9v5"/>` },
  revision: { label: "Révision", icon: `<path d="M20 11.5a8 8 0 10-2.3 5.6"/><path d="M20 5v6.5h-6.5"/>` },
  autre: { label: "Autre", icon: `<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>` },
};
const DEADLINE = new Set(["eval", "examen", "devoir", "exercice"]);
const kindIcon = (k, cls = "kind-ico") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${(KINDS[k] || KINDS.eval).icon}</svg>`;
const kindLabel = (k) => (KINDS[k] || KINDS.eval).label;

const state = {
  events: [], chapters: [], profile: null, tab: "today",
  view: (() => { try { return localStorage.getItem("agenda_view") === "week" ? "week" : "month"; } catch { return "month"; } })(),
  month: firstOfMonth(new Date()), weekStart: mondayOf(new Date()), selected: iso(new Date()),
};

function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function parse(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function addDays(d, n) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function weekNumber(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7)); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function longDate(s) { const d = parse(s); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function dayMonth(s) { const d = parse(s); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function shortDate(s) { const d = parse(s); return `${DAYS[d.getDay()].slice(0, 3)}. ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`; }
function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1).replace(".", ",") + " Mo" : Math.max(1, Math.round(n / 1024)) + " Ko"; }
function ago(t) { const d = new Date(t); return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const col = (c) => `var(--${COLORS.includes(c) ? c : "blue"})`;
const fr = (n, d = 1) => Number(n).toLocaleString("fr-FR", { maximumFractionDigits: d, minimumFractionDigits: 0 });
const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;

const holidayCache = {};
function holidaysOf(year) {
  if (holidayCache[year]) return holidayCache[year];
  const a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  const easter = new Date(year, month - 1, day);
  const list = {
    [`${year}-01-01`]: "Jour de l'an", [iso(addDays(easter, 1))]: "Lundi de Pâques", [`${year}-05-01`]: "Fête du Travail",
    [`${year}-05-08`]: "Victoire 1945", [iso(addDays(easter, 39))]: "Ascension", [iso(addDays(easter, 50))]: "Lundi de Pentecôte",
    [`${year}-07-14`]: "Fête nationale", [`${year}-08-15`]: "Assomption", [`${year}-11-01`]: "Toussaint",
    [`${year}-11-11`]: "Armistice 1918", [`${year}-12-25`]: "Noël",
  };
  return (holidayCache[year] = list);
}
const holiday = (date) => holidaysOf(Number(date.slice(0, 4)))[date];

function getName() { return state.profile?.name || (() => { try { return localStorage.getItem("agenda_name") || ""; } catch { return ""; } })(); }

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  const motion = !reducedMotion();
  if (motion) t.animate([{ transform: "translate(-50%, 20px) scale(.96)", opacity: 0 }, { transform: "translate(-50%, 0)", opacity: 1 }], { duration: 420, easing: EASE });
  setTimeout(() => {
    if (!motion) return t.remove();
    t.animate([{ opacity: 1 }, { transform: "translate(-50%, 10px)", opacity: 0 }], { duration: 220, easing: "ease-in", fill: "forwards" });
    setTimeout(() => t.remove(), 240);
  }, Math.max(2600, msg.length * 70));
}

async function api(path, opts = {}) {
  const res = await fetch("/api/" + path, opts);
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && !path.startsWith("profile/")) { showLogin(); throw new Error("Session expirée"); }
  if (!res.ok) { const err = new Error(data.error || "Erreur"); err.status = res.status; throw err; }
  return data;
}
const send = (path, method, body) => api(path, { method, headers: { "content-type": "application/json" }, body: JSON.stringify(body) });

/* ---------- Login ---------- */
const login = { mode: null, needPass: false };

async function showLogin() {
  const now = new Date();
  $("#iconDay").textContent = DAYS[now.getDay()];
  $("#iconNum").textContent = now.getDate();
  login.needPass = (await fetch("/api/me").catch(() => ({ status: 401 }))).status === 401;
  login.mode = null;
  $("#loginName").value = getName();
  $("#loginName").disabled = false;
  $("#loginPass").classList.toggle("hidden", !login.needPass);
  $("#pinStep").classList.add("hidden");
  $("#loginBack").classList.add("hidden");
  $("#loginBtn").textContent = "Continuer";
  $("#loginErr").textContent = "";
  $("#app").classList.add("hidden");
  $("#tabbar").classList.add("hidden");
  $("#login").classList.remove("hidden");
}

$("#loginBack").onclick = () => showLogin();

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("#loginName").value.trim();
  const err = $("#loginErr");
  err.textContent = "";
  if (!name) { err.textContent = "Écris ton prénom"; return; }
  if (login.needPass && !$("#loginPass").value) { err.textContent = "Entre le mot de passe de la classe"; return; }
  $("#loginBtn").disabled = true;
  try {
    if (!login.mode) {
      const { exists } = await send("profile/check", "POST", { name });
      login.mode = exists ? "existing" : "new";
      $("#loginName").disabled = true;
      $("#pinStep").classList.remove("hidden");
      $("#loginPin2").classList.toggle("hidden", exists);
      $("#pinHint").innerHTML = exists
        ? `Content de te revoir, <b>${esc(name)}</b>. Entre ton code perso.`
        : `Première connexion : crée ton <b>code perso à 6 chiffres</b>. Il te servira à retrouver tes notes sur tous tes appareils.`;
      $("#loginBtn").textContent = exists ? "Entrer" : "Créer mon compte";
      $("#loginBack").classList.remove("hidden");
      $("#loginPin").value = ""; $("#loginPin2").value = "";
      $("#loginPin").focus();
      return;
    }
    const pin = $("#loginPin").value.trim();
    if (!/^\d{6}$/.test(pin)) { err.textContent = "Le code perso fait 6 chiffres"; return; }
    if (login.mode === "new" && pin !== $("#loginPin2").value.trim()) { err.textContent = "Les deux codes ne sont pas identiques"; return; }
    const profile = await send("profile/login", "POST", { name, pin, password: $("#loginPass").value, create: login.mode === "new" });
    try { localStorage.setItem("agenda_name", profile.name); } catch {}
    $("#loginPass").value = ""; $("#loginPin").value = ""; $("#loginPin2").value = "";
    state.profile = profile;
    await start();
    if (login.mode === "new") toast("Compte créé. Retiens bien ton code perso.");
  } catch (ex) {
    err.textContent = ex.message;
  } finally {
    $("#loginBtn").disabled = false;
  }
});

async function start() {
  if (!state.profile) state.profile = await api("profile");
  [state.events, state.chapters] = await Promise.all([api("events"), api("chapters")]);
  const wasHidden = $("#app").classList.contains("hidden");
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#tabbar").classList.remove("hidden");
  if (wasHidden) { $("#app").classList.remove("enter"); void $("#app").offsetWidth; $("#app").classList.add("enter"); }
  renderAll();
  handleDeepLink(location.href);
  registerServiceWorker();
}

function handleDeepLink(href) {
  const url = new URL(href, location.origin);
  const tab = url.searchParams.get("tab");
  const ev = url.searchParams.get("event");
  if (tab && document.getElementById(`page-${tab}`)) showTab(tab);
  if (ev && state.events.some((e) => e.id === ev)) openDetail(ev);
  if (tab || ev) history.replaceState(null, "", "/");
}

/* ---------- Tabs ---------- */
function showTab(tab) {
  if (!document.getElementById(`page-${tab}`)) return;
  state.tab = tab;
  document.querySelectorAll(".page").forEach((p) => p.classList.toggle("hidden", p.id !== `page-${tab}`));
  document.querySelectorAll("#tabbar [data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  renderTab(tab);
  window.scrollTo({ top: 0 });
}
$("#tabbar").addEventListener("click", (e) => {

});

  if (tab === "today") renderToday();

function renderAll() {

}

/* ---------- Done status ---------- */
const isDone = (id) => (state.profile?.done || []).includes(id);
async function toggleDone(id) {
  const done = !isDone(id);
  const set = new Set(state.profile.done);
  if (done) set.add(id); else set.delete(id);
  state.profile.done = [...set];
  document.querySelectorAll(`.ev[data-id="${id}"]`).forEach((el) => el.classList.toggle("done", done));
  renderBadge();
  try {
    state.profile = await send("profile/done", "PUT", { event: id, done });
  } catch (err) {
    toast(err.message);
    if (done) set.delete(id); else set.add(id);
    state.profile.done = [...set];
    renderTab(state.tab);
  }
  if (state.tab === "today") setTimeout(() => state.tab === "today" && renderToday(), 450);
}

function lateItems() {
  const today = iso(new Date());
  const from = iso(addDays(new Date(), -30));
  return state.events.filter((e) => DEADLINE.has(e.kind || "eval") && e.date < today && e.date >= from && !isDone(e.id));
}
function renderBadge() {
  const today = iso(new Date());
  const n = state.events.filter((e) => e.date === today && !isDone(e.id)).length + lateItems().length;
  const btn = $('#tabbar [data-tab="today"]');
  btn.querySelector(".tab-badge")?.remove();
  if (n) btn.querySelector("svg").insertAdjacentHTML("afterend", `<span class="tab-badge">${n}</span>`);
}

/* ---------- Event card ---------- */
const clip = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 01-8.5-8.5l9.2-9.2a4 4 0 015.7 5.7l-9.2 9.2a2 2 0 01-2.8-2.8l8.5-8.5"/></svg>`;
const checkSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
function evCard(e, opts = {}) {
  const kind = e.kind || "eval";
  const today = iso(new Date());
  const late = opts.late || (DEADLINE.has(kind) && e.date < today && !isDone(e.id));
  const parts = [opts.withDate && shortDate(e.date), e.time].filter(Boolean).join(" · ");
  const n = (e.chapters || []).length;
  const j = opts.countdown ? daysBetween(today, e.date) : null;
  return `<div class="ev ${isDone(e.id) ? "done" : ""} ${late ? "late" : ""}" data-id="${e.id}" role="button" tabindex="0" style="--c:${col(e.color)}">

      <div class="meta"><span>${kindIcon(kind)}${kindLabel(kind)}${parts ? " · " + esc(parts) : ""}</span>${late && opts.showLate ? `<span class="late-tag">En retard</span>` : ""}${n && !opts.compact ? `<span>${clip} ${plural(n, "chapitre")}</span>` : ""}</div>
    </span>
    ${j !== null && j >= 0 ? `<span class="jtag" style="align-self:center">${j === 0 ? "Aujourd'hui" : j === 1 ? "Demain" : "J-" + j}</span>` : ""}
    <button class="check" data-done="${e.id}" aria-label="${isDone(e.id) ? "Marquer à faire" : "Marquer comme fait"}">${checkSvg}</button>

}

/* ---------- Agenda ---------- */
function byDate() {
  const m = {};
  for (const e of state.events) (m[e.date] ||= []).push(e);
  return m;
}

function agendaTitleHtml() {
  const caret = `<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;
  if (state.view === "month") {
    const m = state.month;
    return `${MONTHS[m.getMonth()]} <span>${m.getFullYear()}</span>${caret}`;
  }
  const a = state.weekStart, b = addDays(a, 6);
  const label = a.getMonth() === b.getMonth()
    ? `${MONTHS[a.getMonth()]} <span>${a.getFullYear()}</span>`
    : `${MONTHS_SHORT[a.getMonth()]} – ${MONTHS_SHORT[b.getMonth()]} <span>${b.getFullYear()}</span>`;
  return `${label}${caret}<small>Semaine ${weekNumber(a)}</small>`;
}

function monthHtml() {
  const map = byDate();
  const m = state.month;
  const lead = (m.getDay() + 6) % 7;
  const days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  const cells = Math.ceil((lead + days) / 7) * 7;
  const today = iso(new Date());
  let html = "";
  for (let i = 0; i < cells; i++) {
    const n = i - lead + 1;
    if (n < 1 || n > days) { html += `<div class="day blank" aria-hidden="true"></div>`; continue; }
    const d = new Date(m.getFullYear(), m.getMonth(), n);
    const key = iso(d);
    const evs = map[key] || [];
    const fer = holiday(key);
    const cls = ["day", key === today && "today", key === state.selected && "selected", d.getDay() % 6 === 0 && "weekend", fer && "holiday"].filter(Boolean).join(" ");
    const pills = (fer ? `<div class="pill holiday-pill">${esc(fer)}</div>` : "") + evs.slice(0, fer ? 2 : 3).map((e) => `<div class="pill" style="--c:${col(e.color)}${isDone(e.id) ? ";opacity:.45;text-decoration:line-through" : ""}">${esc(e.title)}</div>`).join("");
    const shown = fer ? 2 : 3;
    const more = evs.length > shown ? `<div class="more">+${evs.length - shown} autre${evs.length - shown > 1 ? "s" : ""}</div>` : "";
    const dots = (fer ? `<span class="dot holiday-dot"></span>` : "") + evs.slice(0, 3).map((e) => `<span class="dot" style="--c:${col(e.color)}"></span>`).join("");
    html += `<button class="${cls}" data-date="${key}" aria-label="${longDate(key)}${fer ? ", " + fer : ""}, ${plural(evs.length, "élément")}"><span class="num">${n}</span>${pills}${more}<span class="dots">${dots}</span></button>`;
  }
  return `<div class="grid" id="grid">${html}</div>`;
}

function weekHtml() {
  const map = byDate();
  const today = iso(new Date());
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = addDays(state.weekStart, i);
    const key = iso(d);
    const evs = map[key] || [];
    const fer = holiday(key);
    const cls = ["wday", key === today && "today", key === state.selected && "selected", d.getDay() % 6 === 0 && "weekend", fer && "holiday"].filter(Boolean).join(" ");
    html += `<section class="${cls}" data-date="${key}">
      <button class="wday-head" data-date="${key}" aria-label="${longDate(key)}"><span class="wd-name">${DAYS[d.getDay()].slice(0, 3)}</span><span class="wd-num">${d.getDate()}</span></button>
      <div class="wday-list">${fer ? `<div class="holiday-row">${esc(fer)}</div>` : ""}${evs.length ? evs.map((e) => evCard(e, { compact: true })).join("") : fer ? "" : `<div class="wday-free">—</div>`}</div>
    </section>`;
  }
  return `<div class="week">${html}</div>`;
}

function renderPanel(animate) {
  const map = byDate();
  const today = iso(new Date());
  const sel = map[state.selected] || [];
  const fer = holiday(state.selected);
  $("#dayTitle").innerHTML = `<small>${state.selected === today ? "Aujourd'hui" : DAYS[parse(state.selected).getDay()]}</small>${parse(state.selected).getDate()} ${MONTHS[parse(state.selected).getMonth()]}`;
  $("#dayList").innerHTML = (fer ? `<div class="holiday-row">Jour férié · ${esc(fer)}</div>` : "") + (sel.length ? sel.map((e) => evCard(e)).join("") : `<div class="empty">Rien ce jour-là</div>`);
  const upcoming = state.events.filter((e) => e.date >= today && !isDone(e.id)).slice(0, 6);

  for (const list of [$("#dayList"), $("#upcomingList")]) [...list.children].forEach((c, i) => c.style.setProperty("--i", i));
  if (animate) for (const el of [$("#dayTitle"), $("#dayList")]) { el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter"); }

function renderAgenda(animatePanel) {

function selectDay(date) {
  if (date === state.selected) return;
  document.querySelectorAll("#viewport .selected").forEach((el) => el.classList.remove("selected", "pop"));
  state.selected = date;
  const cell = $(`#viewport .day[data-date="${date}"], #viewport .wday[data-date="${date}"]`);
  if (cell) cell.classList.add("selected", "pop");
  if (state.view === "month") renderPanel(true);
}

let navAnim = 0;
let pendingMonth = null;
let pendingWeek = null;
function slideView(dir, apply, fromX = 0) {
  const id = ++navAnim;
  const vp = $("#viewport"), title = $("#agendaTitle"), wrap = $("#viewportWrap");
  const stopAll = () => [vp, title, wrap].forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
  stopAll();
  if (reducedMotion()) { apply(); return; }
  const w = vp.offsetWidth || 1;
  const sd = Math.sign(dir);
  const h0 = wrap.offsetHeight;
  vp.animate([{ transform: `translateX(${fromX}px)`, opacity: 1 - Math.min(Math.abs(fromX) / w, .6) }, { transform: `translateX(${-sd * w * .35}px)`, opacity: 0 }], { duration: 170, easing: "cubic-bezier(.4,0,1,1)", fill: "forwards" });
  title.animate([{ opacity: 1 }, { opacity: 0, transform: `translateX(${-sd * 16}px)` }], { duration: 170, easing: "ease-in", fill: "forwards" });
  setTimeout(() => {
    if (id !== navAnim) return;
    stopAll();
    apply();
    const h1 = wrap.offsetHeight;
    if (h0 !== h1) wrap.animate([{ height: `${h0}px` }, { height: `${h1}px` }], { duration: 380, easing: EASE });
    vp.animate([{ transform: `translateX(${sd * w * .35}px)`, opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 420, easing: EASE });
    title.animate([{ opacity: 0, transform: `translateX(${sd * 16}px)` }, { opacity: 1, transform: "none" }], { duration: 420, easing: EASE });
  }, 170);
}

function changeMonth(dir, opts = {}) {
  const base = pendingMonth || state.month;
  const target = new Date(base.getFullYear(), base.getMonth() + dir, 1);
  pendingMonth = target;
  slideView(dir, () => {
    pendingMonth = null;
    state.month = target;
    const now = new Date();
    const current = target.getFullYear() === now.getFullYear() && target.getMonth() === now.getMonth();
    state.selected = opts.select || (current ? iso(now) : iso(target));
    state.weekStart = mondayOf(parse(state.selected));
    renderAgenda(true);
  }, opts.fromX);
}

function changeWeek(dir, opts = {}) {
  const base = pendingWeek || state.weekStart;
  const target = addDays(base, 7 * dir);
  pendingWeek = target;
  slideView(dir, () => {
    pendingWeek = null;
    state.weekStart = target;
    const today = new Date();
    const inWeek = iso(today) >= iso(target) && iso(today) <= iso(addDays(target, 6));
    state.selected = opts.select || (inWeek ? iso(today) : iso(target));
    state.month = firstOfMonth(parse(state.selected));
    renderAgenda(true);
  }, opts.fromX);
}

const nav = (dir, opts) => (state.view === "week" ? changeWeek(dir, opts) : changeMonth(dir, opts));

function setView(view) {
  if (view === state.view) return;
  state.view = view;
  try { localStorage.setItem("agenda_view", view); } catch {}
  if (view === "week") state.weekStart = mondayOf(parse(state.selected));
  else state.month = firstOfMonth(parse(state.selected));
  renderAgenda(false);
  if (!reducedMotion()) {
    $("#viewport").animate(view === "week"
      ? [{ transform: "scale(.94)", opacity: 0 }, { transform: "none", opacity: 1 }]
      : [{ transform: "scale(1.05)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 380, easing: EASE });
    $("#agendaTitle").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, easing: "ease-out" });
  }
}

function goToday() {
  const now = new Date();
  if (state.view === "week") {
    const diff = Math.round((mondayOf(now) - state.weekStart) / (7 * 864e5));
    if (diff === 0) return selectDay(iso(now));
    return changeWeek(diff, { select: iso(now) });
  }
  const diff = (now.getFullYear() - state.month.getFullYear()) * 12 + now.getMonth() - state.month.getMonth();
  if (diff === 0) return selectDay(iso(now));
  changeMonth(diff, { select: iso(now) });
}

$("#viewport").addEventListener("click", (e) => {
  if (e.target.closest(".ev")) return;
  const b = e.target.closest("[data-date]");
  if (b && !b.classList.contains("blank")) selectDay(b.dataset.date);
});
$("#viewport").addEventListener("dblclick", (e) => {
  if (e.target.closest(".ev")) return;
  const b = e.target.closest("[data-date]");
  if (b) openEdit(null, b.dataset.date);
});
$("#prev").onclick = () => nav(-1);
$("#next").onclick = () => nav(1);

const gesture = { x: 0, y: 0, dx: 0, active: false, locked: null, pinch: null };
const wrapEl = $("#viewportWrap");
const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
wrapEl.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    gesture.active = false;
    gesture.pinch = { d0: dist(e.touches), scale: 1 };
    return;
  }
  Object.assign(gesture, { x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, active: true, locked: null, pinch: null });
}, { passive: true });
wrapEl.addEventListener("touchmove", (e) => {
  const vp = $("#viewport");
  if (gesture.pinch && e.touches.length === 2) {
    e.preventDefault();
    const s = dist(e.touches) / gesture.pinch.d0;
    gesture.pinch.scale = s;
    vp.style.transform = `scale(${Math.min(1.12, Math.max(.9, 1 + (s - 1) * .35))})`;
    return;
  }
  if (!gesture.active) return;
  const dx = e.touches[0].clientX - gesture.x;
  const dy = e.touches[0].clientY - gesture.y;
  if (gesture.locked === null && Math.hypot(dx, dy) > 8) gesture.locked = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
  if (gesture.locked !== "x") return;
  gesture.dx = dx;
  vp.style.transform = `translateX(${dx}px)`;
  vp.style.opacity = String(1 - Math.min(Math.abs(dx) / vp.offsetWidth, .5));
}, { passive: false });
wrapEl.addEventListener("touchend", (e) => {
  const vp = $("#viewport");
  if (gesture.pinch) {
    if (e.touches.length) return;
    const s = gesture.pinch.scale;
    gesture.pinch = null;
    vp.style.transform = "";
    if (s > 1.18 && state.view === "month") setView("week");
    else if (s < .85 && state.view === "week") setView("month");
    else if (!reducedMotion()) vp.animate([{ transform: `scale(${Math.min(1.12, Math.max(.9, 1 + (s - 1) * .35))})` }, { transform: "none" }], { duration: 320, easing: EASE });
    return;
  }
  if (!gesture.active) return;
  gesture.active = false;
  if (gesture.locked !== "x") return;
  const dx = gesture.dx;
  vp.style.transform = ""; vp.style.opacity = "";
  if (Math.abs(dx) > Math.min(80, vp.offsetWidth * .2)) nav(dx < 0 ? 1 : -1, { fromX: dx });
  else if (!reducedMotion()) vp.animate([{ transform: `translateX(${dx}px)` }, { transform: "none" }], { duration: 380, easing: EASE });
});
let wheelZoom = 0, wheelTimer;
wrapEl.addEventListener("wheel", (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  wheelZoom += e.deltaY;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => { wheelZoom = 0; }, 250);
  if (wheelZoom < -40 && state.view === "month") { wheelZoom = 0; setView("week"); }
  if (wheelZoom > 40 && state.view === "week") { wheelZoom = 0; setView("month"); }
}, { passive: false });

function openMonthPicker() {
  let year = (state.view === "week" ? parse(state.selected) : state.month).getFullYear();
  const now = new Date();
  const bd = openSheet(`
    <div class="sheet-head">
      <button class="link" data-act="close">Fermer</button>
      <h3>Aller à</h3>
      <button class="link" data-act="today">Aujourd'hui</button>
    </div>
    <div class="sheet-body">
      <div class="mp-year">
        <button class="icon-btn" data-y="-1" aria-label="Année précédente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <b id="mpYear"></b>
        <button class="icon-btn" data-y="1" aria-label="Année suivante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <div class="mp-grid" id="mpGrid"></div>
    </div>`);
  const draw = () => {
    bd.querySelector("#mpYear").textContent = year;
    const shown = state.view === "week" ? parse(state.selected) : state.month;
    bd.querySelector("#mpGrid").innerHTML = MONTHS.map((m, i) => {
      const count = state.events.filter((e) => e.date.startsWith(`${year}-${String(i + 1).padStart(2, "0")}`)).length;
      const cls = [year === shown.getFullYear() && i === shown.getMonth() && "on", year === now.getFullYear() && i === now.getMonth() && "cur"].filter(Boolean).join(" ");
      return `<button class="${cls}" data-m="${i}">${m}${count ? `<small>${plural(count, "élément")}</small>` : ""}</button>`;
    }).join("");
    bd.querySelectorAll("[data-m]").forEach((b) => b.onclick = () => jumpTo(new Date(year, Number(b.dataset.m), 1)));
  };
  const jumpTo = (target) => {
    closeSheet();
    const now2 = new Date();
    const sel = target.getFullYear() === now2.getFullYear() && target.getMonth() === now2.getMonth() ? iso(now2) : iso(target);
    if (state.view === "week") {
      const diff = Math.round((mondayOf(parse(sel)) - state.weekStart) / (7 * 864e5));
      if (diff) changeWeek(diff, { select: sel });
      return;
    }
    const diff = (target.getFullYear() - state.month.getFullYear()) * 12 + target.getMonth() - state.month.getMonth();
    if (diff) changeMonth(diff, { select: sel });
  };
  bd.querySelectorAll("[data-y]").forEach((b) => b.onclick = () => {
    year += Number(b.dataset.y);
    draw();
    if (!reducedMotion()) bd.querySelector("#mpGrid").animate([{ opacity: 0, transform: `translateX(${Number(b.dataset.y) * 20}px)` }, { opacity: 1, transform: "none" }], { duration: 300, easing: EASE });
  });
  bd.querySelector("[data-act=close]").onclick = closeSheet;
  bd.querySelector("[data-act=today]").onclick = () => { closeSheet(); goToday(); };
  draw();
}

const MAX_PDF_MB = 100;
const MAX_INPUT_MB = 300;
const SLOTS = [["cours", "Fiche de cours"], ["sujet", "Sujet type"], ["corrige", "Corrigé du sujet"], ["topexo", "TOP EXO du prof"]];
const OPTIONAL_SLOTS = new Set(["topexo"]);
const DCG_UES = [
  "UE1 · Fondamentaux du droit", "UE2 · Droit des sociétés", "UE3 · Droit social", "UE4 · Droit fiscal",
  "UE5 · Économie contemporaine", "UE6 · Finance d'entreprise", "UE7 · Management", "UE8 · Systèmes d'information de gestion",
  "UE9 · Introduction à la comptabilité", "UE10 · Comptabilité approfondie", "UE11 · Contrôle de gestion",
  "UE12 · Anglais appliqué aux affaires", "UE13 · Communication professionnelle",
];
const norm = (s) => String(s || "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ");
const sameSubject = (a, b) => norm(a) === norm(b);

function allSubjects() {
  const seen = new Map();
  for (const s of [...DCG_UES, ...state.chapters.map((c) => c.subject), ...state.events.map((e) => e.subject)]) {
    if (s && !seen.has(norm(s))) seen.set(norm(s), s);
  }
  return [...seen.values()];
}
const canonicalSubject = (s) => allSubjects().find((x) => sameSubject(x, s)) || String(s || "").trim();
const subjectDatalist = () => `<datalist id="subjectList">${allSubjects().map((s) => `<option value="${esc(s)}"></option>`).join("")}</datalist>`;
const chaptersOf = (subject) => state.chapters.filter((c) => sameSubject(c.subject, subject)).sort((a, b) => a.title.localeCompare(b.title, "fr", { numeric: true }));
const chapterById = (id) => state.chapters.find((c) => c.id === id);
const usedBy = (chapterId) => state.events.filter((e) => e.chapters?.includes(chapterId));

function upsertChapter(ch) {
  const i = state.chapters.findIndex((x) => x.id === ch.id);
  if (i >= 0) state.chapters[i] = ch; else state.chapters.push(ch);
}

async function preparePdf(picked, status) {
  const notes = [];
  const images = picked.filter((f) => PdfTools.isImage(f));
  const pdfs = picked.filter((f) => PdfTools.isPdf(f));
  if (picked.length > images.length + pdfs.length) notes.push("fichiers ignorés : PDF, PNG ou JPG seulement");
  let file;
  if (pdfs.length) {
    if (pdfs.length > 1 || images.length) notes.push(`un seul PDF par case : « ${pdfs[0].name} » est utilisé`);
    file = pdfs[0];
    if (file.size > MAX_INPUT_MB * 1024 * 1024) throw new Error(`« ${file.name} » dépasse ${MAX_INPUT_MB} Mo`);
    status("Compression…");
    try {
      const res = await PdfTools.compressPdf(file, (k, n) => status(`Compression · image ${k}/${n}`));
      if (res.compressed) { notes.push(`compressé : ${size(res.before)} → ${size(res.after)}`); file = res.file; }
      else if (file.size > 1024 * 1024) notes.push(res.reason);
    } catch { /* compression is best effort: the original is sent */ }
  } else if (images.length) {
    file = await PdfTools.imagesToPdf(images, (i, n) => status(n > 1 ? `Conversion des photos ${i}/${n}…` : "Conversion en PDF…"));
    notes.push(images.length > 1 ? `${images.length} photos réunies en un PDF` : "photo convertie en PDF");
  } else {
    throw new Error("Choisis un PDF, un PNG ou un JPG");
  }
  if (file.size > MAX_PDF_MB * 1024 * 1024) throw new Error(`« ${file.name} » dépasse encore ${MAX_PDF_MB} Mo après compression`);
  return { file, notes };
}

function putWithProgress(url, file, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("PUT", url);
    x.setRequestHeader("content-type", "application/pdf");
    x.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) return resolve();
      let msg = "Envoi refusé";
      try { msg = JSON.parse(x.responseText).error || msg; } catch {}
      reject(new Error(msg));
    };
    x.onerror = () => reject(new Error("Connexion perdue pendant l'envoi"));
    x.send(file);
  });
}

async function uploadToSlot(chapterId, slot, f, onProgress) {
  const base = { chapter: chapterId, slot, by: getName(), name: f.name };
  const post = (path, body) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const start = await post("files/start", { ...base, size: f.size });
  await putWithProgress(start.uploadUrl, f, onProgress);
  return post("files/finish", { ...base, key: start.key });
}


function openSheet(html) {
  const current = $("#sheetRoot .backdrop:not(.closing)");
  if (current) {
    const sheet = current.querySelector(".sheet");
    const h0 = sheet.offsetHeight;
    sheet.innerHTML = `<div class="grabber"></div>${html}`;
    sheet.scrollTop = 0;
    bindSheetDrag(current);
    if (!reducedMotion()) {
      const h1 = sheet.offsetHeight;
      sheet.animate([{ height: `${h0}px` }, { height: `${h1}px` }], { duration: 380, easing: EASE });
      [...sheet.children].forEach((c) => c.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: "ease-out" }));
    }
    return current;
  }
  $("#sheetRoot").insertAdjacentHTML("beforeend", `<div class="backdrop"><div class="sheet" role="dialog" aria-modal="true"><div class="grabber"></div>${html}</div></div>`);
  const bd = $("#sheetRoot .backdrop:not(.closing)");
  bd.addEventListener("click", (e) => { if (e.target === bd) closeSheet(); });
  bindSheetDrag(bd);
  if (!reducedMotion()) {
    const sheet = bd.querySelector(".sheet");
    bd.animate([{ backgroundColor: "rgba(0,0,0,0)" }, { backgroundColor: "rgba(0,0,0,.35)" }], { duration: 350, easing: "ease-out" });
    sheet.animate(isPhone()
      ? [{ transform: "translateY(100%)" }, { transform: "none" }]
      : [{ transform: "scale(.94)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: isPhone() ? 480 : 340, easing: EASE });
  }
  return bd;
}

function closeSheet(dragged) {
  const fromY = typeof dragged === "number" ? dragged : 0;
  const bd = $("#sheetRoot .backdrop:not(.closing)");
  if (!bd) return;
  bd.classList.add("closing");
  if (reducedMotion()) { bd.remove(); return; }
  const sheet = bd.querySelector(".sheet");
  const d = isPhone() ? 320 : 200;
  sheet.animate(isPhone()
    ? [{ transform: `translateY(${fromY}px)` }, { transform: "translateY(100%)" }]
    : [{ transform: "none", opacity: 1 }, { transform: "scale(.96)", opacity: 0 }], { duration: d, easing: isPhone() ? EASE : "ease-in", fill: "forwards" });
  bd.animate([{ backgroundColor: "rgba(0,0,0,.35)" }, { backgroundColor: "rgba(0,0,0,0)" }], { duration: d, easing: "ease-out", fill: "forwards" });
  setTimeout(() => bd.remove(), d + 20);
}

function bindSheetDrag(bd) {
  const sheet = bd.querySelector(".sheet");
  const handles = [sheet.querySelector(".grabber"), sheet.querySelector(".sheet-head")].filter(Boolean);
  let y0 = null, dy = 0;
  for (const h of handles) {
    h.addEventListener("touchstart", (e) => { if (e.target.closest("button")) return; y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
    h.addEventListener("touchmove", (e) => {
      if (y0 === null) return;
      dy = Math.max(0, e.touches[0].clientY - y0);
      sheet.style.transform = `translateY(${dy}px)`;
    }, { passive: true });
    h.addEventListener("touchend", () => {
      if (y0 === null) return;
      y0 = null;
      sheet.style.transform = "";
      if (dy > 110) closeSheet(dy);
      else if (dy > 0) sheet.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 380, easing: EASE });
    });
  }
}

  if (i >= 0) state.events[i] = ev; else state.events.push(ev);
  state.events.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  render();
}

      </div>

    bd.querySelector("#dateInfo").innerHTML = fer ? `<div class="holiday-row" style="padding-left:16px">Attention : ${esc(fer)}, jour férié</div>` : "";
  };

  const drawChapters = () => {
    const box = bd.querySelector("#chapterPick");

      <label class="pick">
        <input type="checkbox" value="${c.id}" ${d.chapters.includes(c.id) ? "checked" : ""}>

      </label>`).join("");
    const empty = !d.subject.trim()

  };

}

const CATEGORY = { controle: "Contrôle UFA", devoir: "Devoir", examen: "Examen blanc", entrainement: "Entraînement" };
const on20 = (g) => (g.value / g.outOf) * 20;
const counted = (list) => list.filter((g) => g.category !== "entrainement");

function weightedAverage(list) {
  const c = counted(list);
  const coefs = c.reduce((s, g) => s + g.coef, 0);
  return coefs ? c.reduce((s, g) => s + on20(g) * g.coef, 0) / coefs : null;
}

function gradesBySubject() {
  const map = new Map();
  for (const g of state.profile?.grades || []) {
    const key = norm(g.subject);
    if (!map.has(key)) map.set(key, { subject: g.subject, grades: [] });
    map.get(key).grades.push(g);
  }
  for (const v of map.values()) v.grades.sort((a, b) => a.date.localeCompare(b.date));
  return [...map.values()].sort((a, b) => a.subject.localeCompare(b.subject, "fr", { numeric: true }));
}

function generalAverage() {
  const avgs = gradesBySubject().map((s) => weightedAverage(s.grades)).filter((a) => a !== null);
  return avgs.length ? avgs.reduce((s, a) => s + a, 0) / avgs.length : null;
}

let chartId = 0;
function chartSvg(list, { width = 320, height = 120, mini = false } = {}) {
  if (!list.length) return "";
  const id = `cf${++chartId}`;
  const pad = mini ? { l: 2, r: 2, t: 6, b: 4 } : { l: 26, r: 10, t: 10, b: 20 };
  const w = width - pad.l - pad.r, h = height - pad.t - pad.b;
  const x = (i) => pad.l + (list.length === 1 ? w / 2 : (i / (list.length - 1)) * w);
  const y = (v) => pad.t + h - (v / 20) * h;
  const pts = list.map((g, i) => [x(i), y(on20(g))]);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("");
  const area = `${line}L${pts.at(-1)[0].toFixed(1)},${(pad.t + h).toFixed(1)}L${pts[0][0].toFixed(1)},${(pad.t + h).toFixed(1)}Z`;
  let run = "";
  let s = 0, c = 0, first = true;
  list.forEach((g, i) => {
    if (g.category === "entrainement") return;
    s += on20(g) * g.coef; c += g.coef;
    run += `${first ? "M" : "L"}${x(i).toFixed(1)},${y(s / c).toFixed(1)}`;
    first = false;
  });
  const grid = mini ? `<line class="ten" x1="${pad.l}" x2="${pad.l + w}" y1="${y(10)}" y2="${y(10)}"/>`
    : [0, 5, 10, 15, 20].map((v) => `<line class="${v === 10 ? "ten" : "grid-line"}" x1="${pad.l}" x2="${pad.l + w}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join("");
  const labels = mini ? "" : list.map((g, i) => (list.length <= 8 || i % Math.ceil(list.length / 6) === 0 || i === list.length - 1)
    ? `<text x="${x(i)}" y="${height - 4}" text-anchor="middle">${parse(g.date).getDate()}/${parse(g.date).getMonth() + 1}</text>` : "").join("");
  return `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Évolution des notes">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#${id})"/>
    ${run ? `<path class="avg-line" d="${run}"/>` : ""}
    <path class="val-line" d="${line}"/>
    ${pts.map((p, i) => `<circle class="pt ${list[i].category === "entrainement" ? "train" : ""}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${mini ? 2.5 : 4}"/>`).join("")}
    ${labels}
  </svg>`;
}

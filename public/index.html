<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda DCG">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Agenda DCG</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="/app.css">
<script src="/pdf-tools.js" defer></script>
<script src="/tts.js" defer></script>
</head>
<body>

<section id="login" class="hidden">
  <form class="login-card" id="loginForm" novalidate>
    <div class="app-icon"><div class="top" id="iconDay"></div><div class="num" id="iconNum"></div></div>
    <h1>Agenda DCG</h1>
    <p>Les évaluations de la classe et les cours</p>
    <div class="group">
      <input id="loginName" placeholder="Ton prénom" autocomplete="given-name" maxlength="40">
      <input id="loginPass" type="password" placeholder="Mot de passe de la classe" autocomplete="current-password" class="hidden">
    </div>
    <div class="login-step hidden" id="pinStep">
      <p id="pinHint"></p>
      <div class="group">
        <input id="loginPin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••">
        <input id="loginPin2" class="pin hidden" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Confirme">
      </div>
    </div>
    <button class="btn-primary" id="loginBtn">Continuer</button>
    <button type="button" class="link small hidden" id="loginBack">Ce n'est pas moi</button>
    <div class="error" id="loginErr"></div>
    <a class="link small" href="/presentation" style="display:inline-block;margin-top:18px">Découvrir l'appli et l'installer</a>
  </form>
</section>

<section id="app" class="hidden">
  <div class="page" id="page-today"></div>

  <div class="page hidden" id="page-agenda">
    <header class="topbar">
      <div class="left">
        <button class="icon-btn" id="prev" aria-label="Précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="link" id="todayBtn">Aujourd'hui</button>
        <button class="icon-btn" id="next" aria-label="Suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <div class="agenda-tools">
        <div class="view-toggle" role="tablist" aria-label="Affichage">
          <button data-view="month" role="tab">Mois</button>
          <button data-view="week" role="tab">Semaine</button>
          <button data-view="cahier" role="tab">Cahier</button>
        </div>
        <button class="icon-btn" id="addBtn" aria-label="Ajouter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </header>
    <div class="month-view"><h1 class="month-title" id="agendaTitle" role="button" tabindex="0" aria-label="Choisir le mois"></h1></div>
    <div class="layout" id="agendaLayout">
      <div>
        <div class="weekdays"><div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div></div>
        <div id="viewportWrap"><div id="viewport"></div></div>
      </div>
      <aside class="panel">
        <h2 id="dayTitle"></h2>
        <div class="list" id="dayList"></div>
        <div class="upcoming">
          <h2><small>À venir</small></h2>
          <div class="list" id="upcomingList"></div>
        </div>
      </aside>
    </div>
  </div>

  <div class="page hidden" id="page-cours"></div>
  <div class="page hidden" id="page-reviser"></div>
  <div class="page hidden" id="page-settings"></div>
</section>

<nav class="tabbar hidden" id="tabbar" aria-label="Navigation">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5h12V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Aujourd'hui</span></button>
  <button data-tab="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Agenda</span></button>
  <button data-tab="cours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 015.5 4H10a2 2 0 012 2v14a1.5 1.5 0 00-1.5-1.5h-5A1.5 1.5 0 014 17z"/><path d="M20 5.5A1.5 1.5 0 0018.5 4H14a2 2 0 00-2 2v14a1.5 1.5 0 011.5-1.5h5a1.5 1.5 0 001.5-1.5z"/></svg><span>Cours</span></button>
  <button data-tab="reviser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg><span>Réviser</span></button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span>Réglages</span></button>
</nav>

<div id="sheetRoot"></div>

<script src="/js/core.js"></script>
<script src="/js/reviser.js"></script>
<script src="/js/session.js"></script>
<script src="/js/today.js"></script>
<script src="/js/agenda.js"></script>
<script src="/js/events.js"></script>
<script src="/js/cours.js"></script>
<script src="/js/import.js"></script>
<script src="/js/settings.js"></script>
</body>
</html>

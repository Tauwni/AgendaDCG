[build]
  publish = "public"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[dev]
  publish = "public"
  port = 8888

# L'appli iPhone (écran d'accueil) doit toujours récupérer la dernière version
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/schedule.json"
  [headers.values]
    Cache-Control = "no-cache"

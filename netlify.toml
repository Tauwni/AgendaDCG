[build]
  publish = "public"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[dev]
  publish = "public"
  port = 8888

# L'appli iPhone (écran d'accueil) doit toujours récupérer la dernière version
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/app.css"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/tts.js"
  [headers.values]
    Cache-Control = "no-cache"

# L'emploi du temps est modifiable depuis /admin : servi par l'API (repli sur schedule-default.json)
[[redirects]]
  from = "/schedule.json"
  to = "/api/schedule"
  status = 200
  force = true

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
